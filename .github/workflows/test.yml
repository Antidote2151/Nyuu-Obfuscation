name: Run Tests
on:
  workflow_dispatch:
  push:

jobs:
  test-node:
    strategy:
      fail-fast: false
      matrix:
        version: ['24.22.1', '26.13.0']
    name: Test on Node v${{ matrix.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.version }}
      - run: (npm install --production && npm install mocha@11)
      - run: node --pending-deprecation --throw-deprecation --trace-warnings node_modules/mocha/bin/_mocha
