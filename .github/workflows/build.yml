name: Build release binary
on:
  release:
    types:
      - published

jobs:
  build-win64:
    name: Build x64 Windows binary
    runs-on: windows-2025
    env:
      BUILD_ARCH: x64
      BUILD_LOGLEVEL: verbose
    steps:
      - uses: ilammy/setup-nasm@v1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7
      # node-gyp supplied by Win2025 image fails to detect VS2026 - so force update it
      - run: npm install --global npm
      - run: npm install --omit=dev --ignore-scripts
      - run: npm install --omit=dev
        working-directory: nexe
      - run: node build
        working-directory: nexe
      - run: move nexe\nyuu.exe nyuu.exe && 7z a -t7z -mx=9 nyuu.7z config-sample.json nyuu.exe
      - uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./nyuu.7z
          asset_name: nyuu-${{ github.event.release.tag_name }}-win64.7z
          asset_content_type: application/octet-stream
  
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          arch: x64
          xz_bcj: --x86
          name: amd64
        - runner: ubuntu-24.04-arm
          arch: arm64
          xz_bcj: 
          name: aarch64
    name: Build ${{ matrix.name }} Linux binary
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # Node 24 needs GCC >= 12.2, the musl.cc cross toolchains are GCC 11, so build natively on Alpine (musl) instead
      - name: Build in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e BUILD_ARCH=${{ matrix.arch }} -e BUILD_LOGLEVEL=verbose alpine:3.22 sh -ec '
            apk add --no-cache build-base python3 linux-headers nodejs npm
            npm install --omit=dev --ignore-scripts
            cd nexe
            npm install --omit=dev
            node build
            strip nyuu
          '
      - run: tar --group=nobody --owner=nobody -cf - -C nexe nyuu ../config-sample.json | xz -9e ${{ matrix.xz_bcj }} --lzma2 > nyuu.txz
      - uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./nyuu.txz
          asset_name: nyuu-${{ github.event.release.tag_name }}-linux-${{ matrix.name }}.tar.xz
          asset_content_type: application/octet-stream


  build-macos-arm64:
    name: Build macOS ARM64 binary
    runs-on: macos-15
    env:
      BUILD_ARCH: arm64
      BUILD_LOGLEVEL: verbose
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --production
      - run: (cd nexe && npm install --production)
      - run: (cd nexe && node build)
        env:
          CC: cc
          CXX: c++
      - run: tar --owner=$(id -un) --group=staff -cf - -C nexe nyuu ../config-sample.json | xz -9e > nyuu.txz
      - uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./nyuu.txz
          asset_name: nyuu-${{ github.event.release.tag_name }}-mac-arm64.tar.xz
          asset_content_type: application/octet-stream

  build-macos-x64:
    name: Build macOS x64 binary
    runs-on: macos-15-intel
    env:
      BUILD_ARCH: x64
      BUILD_LOGLEVEL: verbose
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm install --production
      - run: (cd nexe && npm install --production)
      - run: (cd nexe && node build)
      - run: tar --owner=$(id -un) --group=staff -cf - -C nexe nyuu ../config-sample.json | xz -9e > nyuu.txz
      - uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./nyuu.txz
          asset_name: nyuu-${{ github.event.release.tag_name }}-mac-x64.tar.xz
          asset_content_type: application/octet-stream

