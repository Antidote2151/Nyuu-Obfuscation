name: Build dev Win64 binary
on:
  workflow_dispatch:

jobs:
  build-dev-win64:
    name: Build x64 Windows binary
    runs-on: windows-2025
    env:
      BUILD_ARCH: x64
      BUILD_LOGLEVEL: verbose
    steps:
      - uses: ilammy/setup-nasm@v1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7
      # node-gyp supplied by Win2025 image fails to detect VS2026 - so force update it
      - run: npm install --global npm
      - run: npm install --omit=dev --ignore-scripts
      - run: npm install --omit=dev
        working-directory: nexe
      - run: node build
        working-directory: nexe
      - run: move nexe\nyuu.exe nyuu.exe && 7z a -t7z -mx=9 nyuu.7z config-sample.json nyuu.exe
      - uses: actions/upload-artifact@v7
        with:
          path: ./nyuu.7z
          name: nyuu-${{ github.ref_name }}-win64.7z
          retention-days: 5
