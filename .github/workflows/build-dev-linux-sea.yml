name: Build dev Linux SEA binary
on:
  workflow_dispatch:
  push: # workflow_dispatch only works once the workflow is on the default branch
    branches: [node24]

jobs:
  build-dev-linux-sea:
    name: Build amd64 dev Linux SEA binary
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
      - run: npm install --omit=dev --ignore-scripts --no-save browserify@17.0.1
      # yencode from npm defaults to -march=native, which crashes (SIGILL) on other CPUs; SIMD kernels are still picked at runtime via CPUID
      - name: Build yencode without native tuning
        run: |
          sed -i 's/"enable_native_tuning%": 1,/"enable_native_tuning%": 0,/' node_modules/yencode/binding.gyp
          npm rebuild yencode
          if grep -l -- '-march=native' node_modules/yencode/build/*.mk; then echo "native tuning still enabled"; exit 1; fi
          grep -ho -- '-mavx2\|-mvpclmulqdq\|-mavx512vbmi2' node_modules/yencode/build/yencode_{avx2,clmul256,vbmi2}.target.mk | sort -u
      - run: node sea/build.js
      - name: Smoke test
        run: |
          head -c 100M /dev/urandom > /tmp/t.bin
          node bench/dummy-nntp.js 5563 2 &
          sleep 1
          sea/out/nyuu -h 127.0.0.1 -P 5563 -S --ignore-cert -u u -p p -n 8 --connection-threads 2 -a 700K -g a.b.test -o /tmp/t.nzb /tmp/t.bin
          test "$(grep -c '<segment ' /tmp/t.nzb)" = 147
      - run: tar --group=nobody --owner=nobody -cf - -C sea/out nyuu -C ../.. config-sample.json | xz -9 --x86 --lzma2 > nyuu.txz
      - uses: actions/upload-artifact@v7
        with:
          path: ./nyuu.txz
          name: nyuu-${{ github.ref_name }}-linux-amd64-sea.7z
          retention-days: 5
