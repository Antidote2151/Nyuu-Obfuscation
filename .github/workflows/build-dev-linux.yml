name: Build dev Linux binary
on:
  workflow_dispatch:

jobs:
  build-dev-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          arch: x64
          xz_bcj: --x86
          name: amd64
        - runner: ubuntu-24.04-arm
          arch: arm64
          xz_bcj: 
          name: aarch64
    name: Build ${{ matrix.name }} dev Linux binary
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Node 24 needs GCC >= 12.2, the musl.cc cross toolchains are GCC 11, so build natively on Alpine (musl) instead
      - name: Build in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e BUILD_ARCH=${{ matrix.arch }} -e BUILD_LOGLEVEL=verbose alpine:3.22 sh -ec '
            apk add --no-cache build-base python3 linux-headers nodejs npm
            npm install --omit=dev --ignore-scripts
            cd nexe
            npm install --omit=dev
            node build
            strip nyuu
          '
      - run: tar --group=nobody --owner=nobody -cf - -C nexe nyuu ../config-sample.json | xz -9e ${{ matrix.xz_bcj }} --lzma2 > nyuu.txz
      - uses: actions/upload-artifact@v4
        with:
          path: ./nyuu.txz
          name: nyuu-${{ github.ref_name }}-linux-${{ matrix.name }}.7z
          retention-days: 5
